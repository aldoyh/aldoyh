<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elements of Life</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    /* CSS Variables for consistent theming */
    :root {
      --primary-color: #4facfe;
      --secondary-color: #00f2fe;
      --accent-color: #ff6b6b;
      --dark-bg: #0a0a1a;
      --darker-bg: #0a192f;
      --text-color: #ffffff;
      --text-secondary: #aaaaaa;
      --card-bg: rgba(10, 20, 30, 0.85);
      --transition-speed: 0.3s;
      --border-radius: 16px;
      --box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      --glow: 0 0 15px rgba(79, 172, 254, 0.5);
    }

    /* Reset and base styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    section:focus {
      outline: none;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      overflow-x: hidden;
      color: var(--text-color);
      background: var(--dark-bg);
      line-height: 1.6;
    }

    /* Skip to content for accessibility */
    .skip-link {
      position: absolute;
      top: -40px;
      left: 6px;
      background: var(--primary-color);
      color: white;
      padding: 8px;
      text-decoration: none;
      border-radius: 4px;
      transition: top 0.3s;
      z-index: 1001;
    }

    .skip-link:focus {
      top: 6px;
    }

    .skip-link:focus-visible {
      outline: 2px solid var(--text-color);
      outline-offset: 4px;
    }

    #main-content:focus,
    section:focus {
      outline: none;
    }

    /* Header and Navigation */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
      background: rgba(10, 20, 30, 0.9);
      backdrop-filter: blur(10px);
      padding: 1rem 5%;
      transition: all var(--transition-speed) ease;
    }

    header.scrolled {
      padding: 0.5rem 5%;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(45deg,
          var(--primary-color),
          var(--secondary-color));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
      border-radius: 4px;
    }

    .logo:focus-visible {
      outline: 2px solid var(--primary-color);
      outline-offset: 4px;
    }

    .logo i {
      font-size: 1.5rem;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
    }

    .nav-links a {
      color: var(--text-color);
      text-decoration: none;
      font-weight: 500;
      font-size: 1.1rem;
      position: relative;
      padding: 0.5rem 0;
      transition: all var(--transition-speed) ease;
    }

    .nav-links a:hover,
    .nav-links a:focus-visible {
      color: var(--primary-color);
    }

    .nav-links a:focus-visible {
      outline: 2px solid var(--primary-color);
      outline-offset: 4px;
      border-radius: 4px;
    }

    .nav-links a::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 2px;
      background: linear-gradient(45deg,
          var(--primary-color),
          var(--secondary-color));
      transition: width var(--transition-speed) ease;
    }

    .nav-links a:hover::after,
    .nav-links a:focus-visible::after {
      width: 100%;
    }

    /* Mobile menu */
    .mobile-menu-btn {
      display: none;
      background: none;
      border: none;
      color: var(--text-color);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .mobile-menu-btn:focus,
    .mobile-menu-btn:focus-visible {
      outline: 2px solid var(--primary-color);
      outline-offset: 4px;
      border-radius: 4px;
    }

    /* Main content */
    main {
      margin-top: 80px;
    }

    /* Section styling */
    section {
      min-height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 5rem 5%;
      overflow: hidden;
    }

    .section-content {
      position: relative;
      z-index: 2;
      text-align: center;
      max-width: 800px;
      padding: 3rem;
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: var(--border-radius);
      box-shadow: var(--box-shadow);
      border: 1px solid rgba(255, 255, 255, 0.1);
      animation: fadeInUp 0.8s ease-out;
    }

    .section-content h1 {
      font-size: 3.5rem;
      margin-bottom: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      background: linear-gradient(45deg,
          var(--primary-color),
          var(--secondary-color));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: slideInDown 0.8s ease-out;
    }

    .section-content p {
      font-size: 1.2rem;
      margin-bottom: 2rem;
      animation: fadeIn 1s ease-out 0.2s both;
    }

    .btn {
      display: inline-block;
      padding: 1rem 2.5rem;
      background: linear-gradient(45deg,
          var(--primary-color),
          var(--secondary-color));
      color: white;
      text-decoration: none;
      border-radius: 50px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all var(--transition-speed) ease;
      box-shadow: var(--box-shadow);
      border: none;
      cursor: pointer;
      font-size: 1rem;
      position: relative;
      overflow: hidden;
    }

    .btn:hover,
    .btn:focus-visible {
      transform: translateY(-5px);
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.4);
    }

    .btn:focus-visible {
      outline: 2px solid var(--primary-color);
      outline-offset: 4px;
    }

    .btn::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg,
          transparent,
          rgba(255, 255, 255, 0.2),
          transparent);
      transition: 0.5s;
    }

    .btn:hover::before {
      left: 100%;
    }

    /* Element-specific backgrounds */
    .element-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 1;
    }

    .water-section {
      background: linear-gradient(135deg,
          #0a192f 0%,
          #0c2a4d 50%,
          #0a192f 100%);
    }

    .water-section .element-bg {
      background-image: url("https://images.unsplash.com/photo-1505118380757-91f5f5632de0?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1920&q=80");
      opacity: 0.7;
    }

    .earth-section {
      background: linear-gradient(135deg,
          #1a2a1d 0%,
          #2a4a2d 50%,
          #1a2a1d 100%);
    }

    .earth-section .element-bg {
      background-image: url("https://images.unsplash.com/photo-1441974231531-c6227db76b6e?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1920&q=80");
      opacity: 0.7;
    }

    .wind-section {
      background: linear-gradient(135deg,
          #1a1a2a 0%,
          #2a2a4a 50%,
          #1a1a2a 100%);
    }

    .wind-section .element-bg {
      background-image: url("https://images.unsplash.com/photo-1476820865390-c52aeebb9891?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1920&q=80");
      opacity: 0.7;
    }

    .magic-section {
      background: linear-gradient(135deg,
          #2a1a2a 0%,
          #4a2a4a 50%,
          #2a1a2a 100%);
    }

    .magic-section .element-bg {
      background-image: url("https://images.unsplash.com/photo-1518837695005-2083093ee35b?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1920&q=80");
      opacity: 0.7;
    }

    /* Parallax effect */
    .parallax-element {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      z-index: 2;
    }

    .water-mountains {
      background-image: url("https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1920&q=80");
      bottom: 0;
      height: 40%;
      background-position: bottom;
    }

    .earth-trees {
      background-image: url("https://images.unsplash.com/photo-1473448912268-2022ce9509d8?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1920&q=80");
      bottom: 0;
      height: 60%;
      background-position: bottom;
    }

    .wind-clouds {
      background-image: url("https://images.unsplash.com/photo-1506260408121-e353d10b87c7?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1920&q=80");
      background-position: center;
      opacity: 0.8;
    }

    .magic-spells {
      background-image: url("https://images.unsplash.com/photo-1511649475669-e288648b2339?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1920&q=80");
      background-position: center;
      opacity: 0.6;
    }

    /* Animations */
    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes float {
      0% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-15px);
      }

      100% {
        transform: translateY(0px);
      }
    }

    .floating {
      animation: float 6s ease-in-out infinite;
    }

    /* Footer */
    footer {
      background: var(--darker-bg);
      padding: 3rem 1rem;
      text-align: center;
    }

    .social-icons {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .social-icons a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 3.5rem;
      height: 3.5rem;
      background: linear-gradient(45deg,
          var(--primary-color),
          var(--secondary-color));
      border-radius: 50%;
      color: white;
      font-size: 1.2rem;
      transition: all var(--transition-speed) ease;
      text-decoration: none;
    }

    .social-icons a:hover,
    .social-icons a:focus-visible {
      transform: translateY(-5px) scale(1.1);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
    }

    .social-icons a:focus-visible {
      outline: 2px solid var(--primary-color);
      outline-offset: 4px;
    }

    .copyright {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    /* Theme toggle */
    .theme-toggle {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      width: 3.5rem;
      height: 3.5rem;
      border-radius: 50%;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: all var(--transition-speed) ease;
      backdrop-filter: blur(10px);
    }

    .theme-toggle:hover {
      transform: scale(1.1);
      box-shadow: var(--box-shadow);
    }

    .theme-toggle:focus,
    .theme-toggle:focus-visible {
      outline: 2px solid var(--primary-color);
      outline-offset: 3px;
      box-shadow: var(--box-shadow);
    }

    /* Responsive design */
    @media (max-width: 992px) {
      .section-content h1 {
        font-size: 3rem;
      }

      .section-content p {
        font-size: 1.1rem;
      }

      /* nextSentence(); */

      .nav-links {
        gap: 1.5rem;
      }
    }
  </style>

  <script>

    $("[words-slide-up]").each(function (index) {
      let tl = gsap.timeline({paused: true});
      tl.from($(this).find(".word"), {opacity: 0, yPercent: 100, duration: 0.5, ease: "back.out(2)", stagger: {amount: 0.5}});
      createScrollTrigger($(this), tl);
    });

    $("[words-rotate-in]").each(function (index) {
      let tl = gsap.timeline({paused: true});
      tl.set($(this).find(".word"), {transformPerspective: 1000});
      tl.from($(this).find(".word"), {rotationX: -90, duration: 0.6, ease: "power2.out", stagger: {amount: 0.6}});
      createScrollTrigger($(this), tl);
    });

    $("[words-slide-from-right]").each(function (index) {
      let tl = gsap.timeline({paused: true});
      tl.from($(this).find(".word"), {opacity: 0, x: "1em", duration: 0.6, ease: "power2.out", stagger: {amount: 0.2}});
      createScrollTrigger($(this), tl);
    });

    $("[letters-slide-up]").each(function (index) {
      let tl = gsap.timeline({paused: true});
      tl.from($(this).find(".char"), {yPercent: 100, duration: 0.2, ease: "power1.out", stagger: {amount: 0.6}});
      createScrollTrigger($(this), tl);
    });

    $("[letters-slide-down]").each(function (index) {
      let tl = gsap.timeline({paused: true});
      tl.from($(this).find(".char"), {yPercent: -120, duration: 0.3, ease: "power1.out", stagger: {amount: 0.7}});
      createScrollTrigger($(this), tl);
    });

    $("[letters-fade-in]").each(function (index) {
      let tl = gsap.timeline({paused: true});
      tl.from($(this).find(".char"), {opacity: 0, duration: 0.2, ease: "power1.out", stagger: {amount: 0.8}});
      createScrollTrigger($(this), tl);
    });

    $("[letters-fade-in-random]").each(function (index) {
      let tl = gsap.timeline({paused: true});
      tl.from($(this).find(".char"), {opacity: 0, duration: 0.05, ease: "power1.out", stagger: {amount: 0.4, from: "random"}});
      createScrollTrigger($(this), tl);
    });

    $("[scrub-each-word]").each(function (index) {
      let tl = gsap.timeline({
        scrollTrigger: {
          trigger: $(this),
          start: "top 90%",
          end: "top center",
          scrub: true
        }
      });
      tl.from($(this).find(".word"), {opacity: 0.2, duration: 0.2, ease: "power1.out", stagger: {each: 0.4}});
    });

    // Avoid flash of unstyled content
    gsap.set("[text-split]", {opacity: 1});


    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');

    let width = window.innerWidth;
    let height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;

    const fontSize = 18;
    const columns = Math.floor(width / fontSize);
    // Here's how to change the characters to Arabic letters-fade-in-random
    // const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789~!@#$%^&*()_+=-`[]\{}|;\':",./<>?';
    const characters = 'أبپتثجچحخدذرزژسشصضطظعغفقكلمنوهیئآئءؤ';
    const drops = [];

    class Drop {
      constructor(x) {
        this.x = x;
        this.y = -fontSize * Math.random() * 10;
        this.speed = gsap.utils.random(5, 15);
        this.value = getRandomCharacter();
        this.opacity = gsap.utils.random(0.2, 1);
        this.color = `rgba(0, 255, 0, ${this.opacity})`;
      }

      draw() {
        ctx.fillStyle = this.color;
        ctx.font = `${fontSize}px monospace`;
        ctx.fillText(this.value, this.x, this.y);
      }

      update() {
        this.y += this.speed;
        this.opacity = gsap.utils.clamp(0, 1, 1 - (this.y / height));
        this.color = `rgba(0, 255, 0, ${this.opacity})`;
        this.value = Math.random() < 0.05 ? getRandomCharacter() : this.value; // Occasional character change

        if (this.y > height + fontSize) {
          this.y = -fontSize * gsap.utils.random(5, 20);
          this.speed = gsap.utils.random(1, 5);
          this.opacity = gsap.utils.random(0.2, .8);
          this.color = `rgba(0, 255, 0, ${this.opacity})`;
          this.value = getRandomCharacter();
        }
      }
    }

    function getRandomCharacter() {
      return characters.charAt(Math.floor(Math.random() * characters.length));
    }

    for (let i = 0; i < columns; i++) {
      drops.push(new Drop(i * fontSize));
    }

    function animate() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
      ctx.fillRect(0, 0, width, height);

      drops.forEach(drop => {
        drop.update();
        drop.draw();
      });

      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', () => {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
      const newColumns = Math.floor(width / fontSize);
      if (newColumns > columns) {
        for (let i = columns; i < newColumns; i++) {
          drops.push(new Drop(i * fontSize));
        }
      } else if (newColumns < columns) {
        drops.length = newColumns;
      }
    });


    // Initial fade-in for the text and start animation
    animate();
  </script>
